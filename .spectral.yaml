# Spectral ruleset enforcing Team Orders' naming convention. This is a REAL blocking gate in
# run-publisher.yml (not `|| true` like the generic APIOps starter kit's lint step).
#
# NOTE: updated to check servers[0].url rather than individual paths -- the real Azure/apiops
# extractor nests the API's own path segment into servers[0].url and makes `paths` relative to it
# (e.g. servers: [.../team-orders], paths: { /status: ... }). Checking paths for a /team-orders
# prefix would incorrectly fail every legitimately-extracted spec.
extends: []
rules:
  team-scoped-server-url:
    description: 'servers[0].url must be scoped under .../team-orders (NAMING-CONVENTIONS.md)'
    message: "servers[0].url '{{value}}' must end with /team-orders -- this repo only owns Team Orders' API surface"
    severity: error
    given: "$.servers[0].url"
    then:
      function: pattern
      functionOptions:
        match: "/team-orders$"

  operation-id-kebab-case:
    description: 'operationId must be kebab-case: <verb>-<resource>[-<detail>]'
    message: "operationId '{{value}}' must be kebab-case, e.g. get-order-status"
    severity: error
    given: "$.paths[*][*].operationId"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"

  title-must-match-team:
    description: 'info.title must match the API display name convention'
    message: "info.title '{{value}}' must start with 'Team Orders'"
    severity: error
    given: "$.info.title"
    then:
      function: pattern
      functionOptions:
        match: "^Team Orders"
